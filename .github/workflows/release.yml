name: Build and Release Native Maven

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest-32-cores
            artifact: nmvn-linux-x86_64
          - os: macos-arm64-cipool
            artifact: nmvn-macos-aarch64
          - os: windows-latest-16-cores
            artifact: nmvn-windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Strip SNAPSHOT from versions
        run: LC_ALL=C find . -name 'pom.xml' -exec sed -i'' -e 's/-SNAPSHOT//g' {} +

      - name: Build Maven distribution
        run: mvn clean package -B -DskipTests -Drat.skip=true -Dcheckstyle.skip=true

      - name: Build native image
        run: |
          chmod +x build-nmvn-no-crema.sh
          ./build-nmvn-no-crema.sh

      - name: Assemble distribution
        run: |
          MAVEN_HOME=apache-maven/target/apache-maven-4.1.0
          DIST_DIR=native-maven
          mkdir -p "$DIST_DIR"/bin "$DIST_DIR"/conf "$DIST_DIR"/lib

          cp dist/mvn "$DIST_DIR"/bin/
          cp dist/nmvn-native "$DIST_DIR"/bin/
          chmod +x "$DIST_DIR"/bin/mvn "$DIST_DIR"/bin/nmvn-native

          cp -r "$MAVEN_HOME"/conf/* "$DIST_DIR"/conf/
          cp -r "$MAVEN_HOME"/lib/* "$DIST_DIR"/lib/
          cp "$MAVEN_HOME"/README.txt "$DIST_DIR"/ 2>/dev/null || true

          zip -r ${{ matrix.artifact }}.zip "$DIST_DIR"/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.sha }}
          name: Native Maven v0.1.0
          files: |
            nmvn-linux-x86_64.zip
            nmvn-macos-aarch64.zip
            nmvn-windows-x86_64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}