# Build specialized Spring Boot nmvn native images (nmvn-spring-<bootVersion>) per platform.
#
# Same commands as local. Scripts write under build/ by default:
#   build/catalogs/   — catalogs
#   build/work/       — scratch
#   build/nmvn-spring-* — images
# Maven dist stays in apache-maven/target/.
#
# Toolchain: downloads GraalVM Community 25.2.4 (graal-25.2.4 / jdk 25.0.4) for the runner
# platform and puts it on PATH. build-nmvn-prebuilt.sh requires Crema flags
# (RuntimeClassLoading, GraalJITCompileAtRuntime); the workflow fails fast if the
# downloaded native-image lacks them.
#
# Per platform, for Boot 4.1.0 and 4.0.7:
#   resolve_boot_catalog.py → build-nmvn-catalog.sh → zip to dist/
#
name: Build Spring Native Maven

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # GraalVM Community 25 Innovation 2 — https://github.com/graalvm/graalvm-ce-builds/releases/tag/graal-25.2.4
  GRAAL_TAG: graal-25.2.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest-32-cores
            platform: linux-x86_64
            graal_file: graalvm-community-jdk-25i2-25.0.4_linux-x64_bin.tar.gz
          - os: ubuntu-latest-32-cores-arm64
            platform: linux-aarch64
            graal_file: graalvm-community-jdk-25i2-25.0.4_linux-aarch64_bin.tar.gz
          - os: macos-arm64-cipool
            platform: macos-aarch64
            graal_file: graalvm-community-jdk-25i2-25.0.4_macos-aarch64_bin.tar.gz
          - os: windows-latest-16-cores
            platform: windows-x86_64
            graal_file: graalvm-community-jdk-25i2-25.0.4_windows-x64_bin.zip

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read

    env:
      BOOT_VERSIONS: "4.1.0 4.0.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and install GraalVM 25.2
        run: |
          set -euo pipefail
          GRAAL_URL="https://github.com/graalvm/graalvm-ce-builds/releases/download/${GRAAL_TAG}/${{ matrix.graal_file }}"
          INSTALL_ROOT="${RUNNER_TEMP:-/tmp}/graalvm-25.2"
          ARCHIVE="${RUNNER_TEMP:-/tmp}/${{ matrix.graal_file }}"

          echo ">>> Downloading ${GRAAL_URL}"
          rm -rf "${INSTALL_ROOT}"
          mkdir -p "${INSTALL_ROOT}"
          curl -fsSL "${GRAAL_URL}" -o "${ARCHIVE}"

          case "${{ matrix.graal_file }}" in
            *.zip)
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "${ARCHIVE}" -d "${INSTALL_ROOT}"
              else
                pwsh -NoProfile -Command "Expand-Archive -Path '${ARCHIVE}' -DestinationPath '${INSTALL_ROOT}' -Force"
              fi
              ;;
            *)
              tar -xzf "${ARCHIVE}" -C "${INSTALL_ROOT}"
              ;;
          esac

          # Locate JAVA_HOME (macOS uses Contents/Home; Linux/Windows unpack to a single root).
          JAVA_HOME_CANDIDATE=""
          if [ -d "${INSTALL_ROOT}" ]; then
            # Prefer */Contents/Home (macOS .app-style layout)
            for d in "${INSTALL_ROOT}"/*/Contents/Home "${INSTALL_ROOT}"/*/*/Contents/Home; do
              if [ -x "${d}/bin/native-image" ] || [ -f "${d}/bin/native-image" ] || [ -f "${d}/bin/native-image.cmd" ]; then
                JAVA_HOME_CANDIDATE="$d"
                break
              fi
            done
            if [ -z "${JAVA_HOME_CANDIDATE}" ]; then
              for d in "${INSTALL_ROOT}"/*; do
                if [ -d "$d" ] && { [ -x "${d}/bin/native-image" ] || [ -f "${d}/bin/native-image" ] || [ -f "${d}/bin/native-image.cmd" ]; }; then
                  JAVA_HOME_CANDIDATE="$d"
                  break
                fi
              done
            fi
          fi

          if [ -z "${JAVA_HOME_CANDIDATE}" ]; then
            echo "::error::Could not find native-image under ${INSTALL_ROOT}"
            find "${INSTALL_ROOT}" -maxdepth 4 -type f -name 'native-image*' 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "JAVA_HOME=${JAVA_HOME_CANDIDATE}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_CANDIDATE}/bin" >> "$GITHUB_PATH"
          echo ">>> JAVA_HOME=${JAVA_HOME_CANDIDATE}"
          echo ">>> bin: ${JAVA_HOME_CANDIDATE}/bin"

      - name: Verify Crema-capable native-image
        run: |
          set -euo pipefail
          export PATH="${JAVA_HOME}/bin:${PATH}"
          if ! command -v native-image >/dev/null 2>&1 && ! command -v native-image.cmd >/dev/null 2>&1; then
            echo "::error::native-image not on PATH after GraalVM install"
            echo "PATH=$PATH"
            ls -la "${JAVA_HOME}/bin" | head -40
            exit 1
          fi
          NI="$(command -v native-image 2>/dev/null || command -v native-image.cmd)"
          echo ">>> native-image: ${NI}"
          "${NI}" --version 2>&1 | head -8
          OPTS="$("${NI}" --expert-options-all 2>&1 || true)"
          for req in RuntimeClassLoading GraalJITCompileAtRuntime; do
            case "$OPTS" in
              *"$req"*) echo ">>> OK: ${req}" ;;
              *)
                echo "::error::Downloaded GraalVM 25.2 native-image lacks -H:±${req}"
                echo "Path: ${NI}"
                echo "This build needs Crema. If CE 25.2.4 still omits these flags, use a custom Graal build."
                exit 1
                ;;
            esac
          done
          java -version 2>&1 | head -3

      - name: Strip SNAPSHOT from versions
        run: LC_ALL=C find . -name 'pom.xml' -exec sed -i'' -e 's/-SNAPSHOT//g' {} +

      - name: Build Maven distribution
        run: |
          export PATH="${JAVA_HOME}/bin:${PATH}"
          chmod +x ./mvnw
          ./mvnw clean package -B -DskipTests -Drat.skip=true -Dcheckstyle.skip=true

      - name: Resolve catalogs and build Spring specialized images
        run: |
          set -euo pipefail
          export PATH="${JAVA_HOME}/bin:${PATH}"
          chmod +x catalog/resolve_boot_catalog.py build-nmvn-catalog.sh build-nmvn-prebuilt.sh

          # Fresh build tree (same layout as local defaults).
          rm -rf build dist
          mkdir -p dist

          package_zip() {
            local zip_name="$1"
            shift
            if command -v zip >/dev/null 2>&1; then
              zip -j "${zip_name}" "$@"
            else
              pwsh -NoProfile -Command \
                "Compress-Archive -Path @($(printf "'%s'," "$@" | sed 's/,$//')) -DestinationPath '${zip_name}' -Force"
            fi
          }

          for BOOT in $BOOT_VERSIONS; do
            CATALOG="build/catalogs/nmvn-spring-${BOOT}.json"
            echo "=========================================="
            echo ">>> Boot ${BOOT}"
            echo "=========================================="

            ./catalog/resolve_boot_catalog.py \
              --boot-version "${BOOT}" \
              --language java

            ./build-nmvn-catalog.sh "${CATALOG}"

            BIN="build/nmvn-spring-${BOOT}"
            if [ -f "${BIN}.exe" ]; then
              BIN="${BIN}.exe"
            fi
            if [ ! -f "${BIN}" ]; then
              echo "::error::Expected binary ${BIN} after build for Boot ${BOOT}"
              ls -la build/ || true
              exit 1
            fi

            PLUGINS="build/nmvn-spring-${BOOT}.plugins"
            ZIP="nmvn-spring-${BOOT}-${{ matrix.platform }}-${{ github.sha }}.zip"
            package_zip "dist/${ZIP}" "${BIN}" "${PLUGINS}"
            echo ">>> Packaged dist/${ZIP}"
          done

          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nmvn-spring-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Clean workspace outputs
        if: always()
        run: rm -rf build dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Publish to R2
        uses: elide-tools/r2-upload-action@main
        with:
          path: artifacts
          target: native-maven
          bucket: elide-userdata-public
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Clean downloaded artifacts
        if: always()
        run: rm -rf artifacts
