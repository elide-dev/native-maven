# nmvn sidecar: the native-image flags owned by the sidecar/launcher CODE, shared by BOTH image
# variants. native-image applies this file automatically because the sidecar jar is on the image
# classpath — the same mechanism jvm-channel uses. Anything variant-specific or per-invocation
# stays in build-scripts/<variant>/build-nmvn-prebuilt.sh: Crema options (-H:+RuntimeClassLoading,
# -H:+GraalJITCompileAtRuntime), -H:Preserve sets, -H:ConfigurationFileDirectories (per-variant
# metadata dirs), the dynamic -Dnmvn.prebuilt.* inputs, builder heap, classpath, main class.
#
# Flag rationale, in Args order below:
#
# - UnlockExperimentalVMOptions: repeated here because a properties file's Args are processed as
#   their own sequence — the unlock must precede this file's experimental -H: flags regardless of
#   what the invoking script passes.
#
# - ParseRuntimeOptions OFF: SVM by default parses and CONSUMES -D/-XX/-Xm* arguments at VM
#   startup, stripping them from the argv Maven sees — a bare `-DskipTests` became system property
#   skipTests="" and Maven's own "bare -D means true" CLI semantics never applied. With it off,
#   every argument reaches Maven's CLI parsing; NmvnLauncher mirrors -D args into system
#   properties (the part of SVM's behavior launchers actually relied on).
#
# - ClassForNameRespectsClassLoader: THE flag that makes baked realms work without Crema. It
#   DEFAULTS TO FALSE, and with it false SVM resolves Class.forName AND getResource(s) through ONE
#   GLOBAL NAMESPACE, ignoring the class loader argument — the whole prebuilt design is per-realm
#   class identity, so a flat namespace makes any name present in more than one realm resolve to
#   an arbitrary winner (observed: maven-war-plugin's realm-shipped FileLockNamedLockFactory bound
#   into plexus.core, "cannot be cast to NamedLockFactory"; with other bake sets a null Injector
#   inside sisu's AbstractDeferredClass from the same collision on org.eclipse.sisu classes).
#   Crema turns it on implicitly (RuntimeClassLoading's onValueUpdate); stated explicitly so both
#   variants agree. Its other implications (-ClosedTypeWorld, -SupportPredefinedClasses) are NOT
#   carried over — they exist to support DEFINING classes at run time.
#
# - IncludeResources META-INF/...: sisu indexes, plugin descriptors, services, plexus components —
#   the resources core discovery reads at run time. org/apache/maven/plugins/clean: the clean
#   plugin reads its own resources. nmvn/hotspot: the JVM fallback's HotSpot-side wrapper jar,
#   baked as a resource and extracted onto the in-process HotSpot JVM's classpath
#   (see HotspotMavenRunner.extractWrapper).
#
# - add-exports/add-opens jdk.compiler: in-process javac (maven-compiler-plugin runs the image's
#   own compiler — no external javac process exists to fork).
#
# - initialize-at-build-time: nmvn.PrebuiltPluginRealms and the model/XML/logging packages its
#   static initializer touches while building the baked world during the image build.
#
# - -J--add-exports com.oracle.svm.core.hub: PrebuiltPluginRealms.detectRuntimeClassLoading()
#   reflectively reads RuntimeClassLoading.isSupported() inside the BUILDER (build-time init) to
#   bake the variant answer for --info=variant; the builder module does not export that package
#   to app classes by default.
#
# - initialize-at-run-time jline ffm: the whole PACKAGE, not just CLibrary — nested types are
#   separate classes, so naming the outer class leaves CLibrary$termios build-time-initialized,
#   and on Windows its <clinit> throws "Unsupported system!" (POSIX-only FFM struct layout). At
#   run time jline probes providers and falls back, exactly as on HotSpot Windows today.
Args = -J--add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.hub=ALL-UNNAMED \
       -H:+UnlockExperimentalVMOptions \
       --no-fallback \
       -H:-ParseRuntimeOptions \
       -H:+ClassForNameRespectsClassLoader \
       -H:+ReportExceptionStackTraces \
       -H:+AllowJRTFileSystem \
       -H:EnableURLProtocols=jar \
       -H:IncludeResources=META-INF/(maven|sisu|services|plexus)/.* \
       -H:IncludeResources=org/apache/maven/plugins/clean/.* \
       --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
       --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
       --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED \
       --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
       --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED \
       --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED \
       --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
       --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED \
       --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
       --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
       --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
       --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED \
       --initialize-at-build-time=nmvn.PrebuiltPluginRealms,nmvn.PrebuiltPluginRealms$Prebuilt,nmvn.PrebuiltPluginRealms$BakedClassLoader,nmvn.PrebuiltPluginRealms$SelfFirstRealm,org.apache.maven.plugin.descriptor,org.apache.maven.artifact,org.codehaus.plexus.component.repository,org.codehaus.plexus.configuration,org.codehaus.plexus.classworlds,org.apache.maven.internal.xml,com.ctc.wstx.stax.WstxInputFactory,com.ctc.wstx.util,com.ctc.wstx.api,org.apache.maven.api.xml,org.slf4j,org.apache.maven.slf4j,org.apache.maven.logging,com.sun.tools.javac.api.JavacTool \
       --initialize-at-run-time=jdk.internal.org.jline.terminal.impl.ffm,jdk.internal.jrtfs.SystemImage \
       --features=nmvn.PrebuiltReflectionFeature
